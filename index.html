<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="script.js" defer></script>
    <title>Home — resipi</title>

    <link rel="stylesheet" href="css/styles.css">
  </head>
  <body>

    <div class="header">
      <div class="logo">resipi</div>
      <div class="nav">
        <a href="recipeForm.html">add recipe</a>
        <a href="tempConversion.html">conversion</a>
        <div class="nav-right">
          <input type="text" id="search-bar" placeholder="Search for recipe">
          <div class="dropdown">
            <div id="myDropdown" class="dropdown-content">
              <ul class="suggestions">
                </ul>
              </div>
            </div>
            <button class="icon" id="search-button">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2.5" stroke-linecap="round"
                stroke-linejoin="round">
                <circle cx="11" cy="11" r="8"></circle>
                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
              </svg>
            </button>
            <button class="icon" id="menu-button"
              onclick="openNav()">&#9776;</button>
          </div>
        </div>
      </div>

      <div class="main-layout">

        <div class="recipe-content">
          <h1 class="section-title">My Recipes</h1>

          <div class="recipe-grid" id="recipe-grid">

          </div>
        </div>

        <div class="sidebar" id="sidebar">
          <div class="sidebar-content">
            <h3 class="sidebar-title">Filters</h3>

            <h4 class="filter-group-title">Dietary Restrictions:</h4>
            <label class="filter-label"><input type="checkbox">
              Gluten-free</label>
            <label class="filter-label" id="filter-label"><input
                type="checkbox"> Vegan</label>
            <label class="filter-label" id="filter-label"><input
                type="checkbox"> Nut-free</label>
            <label class="filter-label" id="filter-label"><input
                type="checkbox"> Soy-free</label>
            <label class="filter-label" id="filter-label"><input
                type="checkbox"> Dairy-free</label>

            <h4 class="filter-group-title">Recipe Type:</h4>
            <label class="filter-label" id="filter-label"><input
                type="checkbox"> Dessert</label>
            <label class="filter-label" id="filter-label"><input
                type="checkbox"> Entree</label>
            <label class="filter-label" id="filter-label"><input
                type="checkbox"> Appetizer</label>
          </div>
        </div>

      </div>

      <script>
      document.addEventListener('DOMContentLoaded', async function() {
        const recipes = await getAllRecipes();
        document.getElementById("recipe-grid").innerHTML = recipes.map(recipe => 
          `<div class="recipe-card">
           <img src="${recipe.image_url != null ? '/' + recipe.image_url.replace(/^\/+/, '') : '/images/placeholder.jpg'}"
              alt="${recipe.name}" class="recipe-img-square">
            <h3 class="recipe-card-title">${recipe.name}</h3>
            <div class="stars">&#9733;&#9733;&#9733;&#9733;&#9734;</div>
            <a href="displayRecipe.html?id=${recipe.id}" class="view-recipe-link">View Recipe</a>
          </div>`).join('');
        
});

    
  </script>

    </body>
  </html>
