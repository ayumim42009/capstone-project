<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="script.js" defer></script>
    <title> review recipe — resipi</title>
    <link rel="stylesheet" href="css/styles.css">
    <style>
      body {
        display: grid;
      }
      </style>
  </head>
  <body>

    <div class="header">
      <div class="logo" onclick="window.location.href='index.html'">resipi</div>
      <div class="nav">
        <a href="recipeForm.html">add recipe</a>
        <a href="tempConversion.html">conversion</a>
        <div class="nav-right">
          <input type="text" id="search-bar" placeholder="Search for recipe">
          <button class="icon" id="search-button">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="2.5" stroke-linecap="round"
              stroke-linejoin="round">
              <circle cx="11" cy="11" r="8"></circle>
              <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
          </button>
          <button class="icon" id="hamburger-menu">&#9776;</button>
        </div>
      </div>
    </div>

    <div class="page-content">

      <div class="recipe-top">
        <div>
          <h1 class="recipe-title"></h1>

          <div class="ingredients-section">
            <div class="section-heading">Ingredients:</div>
            <ul class="ingredients-list">
            </ul>
          </div>
        </div>

        <div><img src="" alt=""
            class="recipe-img" id="recipe-img"></div>
      </div>
<div class="divider">
      <div class="steps-section">
        <div class="section-heading">Steps:</div>
        <ol class="steps-list">

        </ol>
      </div>

      <div class="add-btn-wrap">
        <button class="action-btn" id="modify">Modify Recipe</button>
      </div>
      <div class="add-btn-wrap">
        <button class="action-btn" id="delete">Delete Recipe</button>
      </div>

    </div>
    </div>

    <script>

      let params = new URLSearchParams(window.location.search);

      let recipeId = params.get("id");

      document.addEventListener('DOMContentLoaded', async function() {

        const recipeData = await readRecipeData(recipeId);

        const name = sessionStorage.getItem("selectedRecipe"); 
        const id = await getRecipeIdByName(name);

        document.getElementsByClassName("recipe-title")[0].textContent = recipeData[0].name;
        document.getElementById("recipe-img").src = recipeData[0].image_url != null ? '/' + recipeData[0].image_url.replace(/^\/+/, '') : '/images/placeholder.jpg';
        document.getElementById("recipe-img").alt = recipeData[0].name;
        document.getElementsByClassName("ingredients-list")[0].innerHTML = recipeData[0]['ingredients'].map(ingredient => `<li>${ingredient}</li>`).join('');
        document.getElementsByClassName("steps-list")[0].innerHTML = recipeData[0]['instructions'].map((step, index) => `<li><span class="step-num">${index + 1}.</span> ${step}</li>`).join('');

        const deleteButton = document.getElementById("delete");
        deleteButton.addEventListener("click", removeRecipeData);

        const modifyButton = document.getElementById("modify");
        modifyButton.addEventListener("click", () => {
        window.location.href = `modifyRecipe.html?id=${recipeData[0].id}`;
});
      
        
      });
  </script>

  </body>
</html>
