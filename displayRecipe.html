<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="script.js" defer></script>
    <title> review recipe — resipi</title>
    <link rel="stylesheet" href="css/styles.css">
    <style>
    /* page-specific styles */

    .recipe-top {
      display: grid;
      grid-template-columns: 1fr 200px;
      gap: 2rem;
      margin-bottom: 2rem;
      align-items: start;
    }

    .recipe-title {
      font-family: 'Roboto', sans-serif;
      font-style: normal;
      font-size: 1.5rem;
      font-weight: bold;
      color: #2C1A0E;
      margin-bottom: 1.75rem;
    }


    .recipe-description {
      font-size: 0.88rem;
      color: #5a3e35;
      line-height: 1.5;
      margin-bottom: 1.25rem;
    }

    /* recipe image */
    .recipe-img {
      width: 250px;
      height: 300px;
      object-fit: cover;
      border-radius: 6px;
    }

    .recipe-img-placeholder {
      width: 200px;
      height: 160px;
      background: linear-gradient(135deg, #D4B89A, #C4A07A);
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: rgba(255,255,255,0.7);
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    /* ingredients */
    .ingredients-section {
      margin-bottom: 1.75rem;
    }

    .ingredients-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 0.3rem;
    }

    .ingredients-list li {
      font-size: 0.88rem;
      line-height: 1.5;
      padding-left: 0.75rem;
      position: relative;
    }

    .ingredients-list li::before {
      content: '•';
      position: absolute;
      left: 0;
      color: #992900;
    }

    /* steps */
    .steps-section {
      margin-bottom: 1.75rem;
    }

    .steps-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 0.65rem;
    }

    .steps-list li {
      font-size: 0.88rem;
      line-height: 1.6;
    }

    .steps-list li span.step-num {
      font-weight: 700;
      color: #992900;
    }

    /* recipe button */
    .add-btn-wrap {
      display: flex;
      justify-content: center;
      padding-bottom: 3rem;
    }

    .section-heading {
      font-family: 'Roboto', sans-serif;
      font-size: 1rem;  
      font-weight: 700;
      color: #3D1500;
      text-transform: capitalize;
      margin-bottom: 0.5rem;
    }

  </style>
  </head>
  <body>

    <div class="header">
      <div class="logo">resipi</div>
      <div class="nav">
        <a href="index.html">home</a>
        <a href="recipeForm.html">add recipe</a>
        <a href="tempConversion.html">conversion</a>
        <div class="nav-right">
          <input type="text" placeholder="Search for recipe">
          <button class="icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="2.5" stroke-linecap="round"
              stroke-linejoin="round">
              <circle cx="11" cy="11" r="8"></circle>
              <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
          </button>
          <button class="icon">&#9776;</button>
        </div>
      </div>
    </div>

    <div class="page-content">

      <div class="recipe-top">
        <div>
          <h1 class="recipe-title"></h1>

          <div class="ingredients-section">
            <div class="section-heading">Ingredients:</div>
            <ul class="ingredients-list">
            </ul>
          </div>
        </div>

        <div><img src="images/Lemon-Ricotta-Cookies-5.jpg" alt="Lemon Cookies"
            class="recipe-img"></div>
      </div>

      <div class="steps-section">
        <div class="section-heading">Steps:</div>
        <ol class="steps-list">

        </ol>
      </div>

      <div class="add-btn-wrap">
        <button class="action-btn" id="modify">Modify Recipe</button>
      </div>
      <div class="add-btn-wrap">
        <button class="action-btn" id="delete">Delete Recipe</button>
      </div>

    </div>

    <script>
      document.addEventListener('DOMContentLoaded', async function() {
        const name = sessionStorage.getItem("selectedRecipe"); 
        const id = await getRecipeIdByName(name);
        console.log(id);
        const recipeData = await readRecipeData(id);
        console.log(recipeData[0]['ingredients']);
        console.log(recipeData[0]['instructions']);

        document.getElementsByClassName("recipe-title")[0].textContent = recipeData[0].name;
        document.getElementsByClassName("ingredients-list")[0].innerHTML = recipeData[0]['ingredients'].map(ingredient => `<li>${ingredient}</li>`).join('');
        document.getElementsByClassName("steps-list")[0].innerHTML = recipeData[0]['instructions'].map((step, index) => `<li><span class="step-num">${index + 1}.</span> ${step}</li>`).join('');

        const deleteButton = document.getElementById("delete");
        deleteButton.addEventListener("click", removeRecipeData);

        const modifyButton = document.getElementById("modify");
        modifyButton.addEventListener("click", () => {
        window.location.href = `modifyRecipe.html?id=${recipeData[0].id}`;
});
      
        
      });
  </script>

  </body>
</html>
