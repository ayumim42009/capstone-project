<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recipe Form — resipi</title>

    <link rel="stylesheet" href="css/styles.css">

    <script src="script.js" defer></script>
  </head>
  <body>

    <div class="header">
      <div class="logo">resipi</div>
      <div class="nav">
        <a href="index.html">home</a>
        <a href="recipeForm.html">add recipe</a>
        <a href="tempConversion.html">conversion</a>
        <div class="nav-right">
          <input type="text" id="search-bar" placeholder="Search for recipe">
          <button class="icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="2.5" stroke-linecap="round"
              stroke-linejoin="round">
              <circle cx="11" cy="11" r="8"></circle>
              <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
          </button>
          <button class="icon" id="hamburger-menu">&#9776;</button>
        </div>
      </div>
    </div>

    <div class="page-content">
      <h1>Edit the Recipe:</h1>
      <h2>Recipe Name</h2>
      <form name="recipe-form" id="recipe-form">
        <input type="text" id="recipe-name" name="recipe-name">
      </form>
      <div class="heading-row">
        <h2>Ingredients</h2>
        <button type="button" id="ingredient-add-button">+</button>
        <button type="button" id="ingredient-remove-button">-</button>
      </div>

      <form name="ingredient-form" id="ingredient-form">
        <label for="ingredient1">Ingredient 1:</label>
        <input type="text" id="ingredient1" name="ingredient1">
      </form>
      <div class="heading-row"><h2>Instructions</h2> <button type="button"
          id="instruction-add-button">+</button>
        <button type="button" id="instruction-remove-button">-</button></div>
        
      <form id="instructions-form" name="instructions-form">
        <label for="instructions">Step 1:</label><br>
        <input type="text" id="instructions" name="instructions">
      </form>
      <button class="action-btn" id="modify-button">
        Save Changes
      </button>
    </body>
    <script>
      let params = new URLSearchParams(window.location.search);

      let recipeId = params.get("id");

      document.addEventListener('DOMContentLoaded', async function() {
        const recipeData = await readRecipeData(recipeId);
        // Fetch the recipe data from the database and populate the form fields
        //fetch(`https://2spa6g6eub.execute-api.us-east-2.amazonaws.com/test/readRecipe?id=${recipeId}`)
        //.then(response => response.json())
        //.then(recipeData => {
          //document.getElementsByClassName("recipe-form")[0].textContent = recipeData[0].name;
          document.getElementById("recipe-name").value = recipeData[0].name;
          document.getElementById("ingredient-form").innerHTML = recipeData[0]['ingredients'].map((ingredient,  index) => 
          `<label for="ingredient${index + 1}">Ingredient ${index + 1}:</label>
          <input type="text" id="ingredient${index + 1}" name="ingredient${index + 1}" value="${ingredient}">`).join('');
          document.getElementById("instructions-form").innerHTML = recipeData[0]['instructions'].map((step, index) => 
          `<label for="instructions${index + 1}">Step ${index + 1}:</label>
          <input type="text" id="instructions${index + 1}" name="instructions${index + 1}" value="${step}">`).join('');
        //});

        const modifyButton = document.getElementById("modify-button");
          modifyButton.addEventListener("click", modifyRecipeData);
      });
    </script>  
  </html>
