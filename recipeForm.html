<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recipe Form — resipi</title>
    <link rel="stylesheet" href="css/styles.css">
    <script src="script.js" defer></script>
  </head>
  <body>

    <div class="header">
      <div class="logo" onclick="window.location.href='index.html'">resipi</div>
      <div class="nav">
        <a href="recipeForm.html">add recipe</a>
        <a href="tempConversion.html">conversion</a>
        <div class="nav-right">
          <input type="text" id="search-bar" placeholder="Search for recipe">
          <button class="icon" id="search-button">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="2.5" stroke-linecap="round"
              stroke-linejoin="round">
              <circle cx="11" cy="11" r="8"></circle>
              <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
          </button>
          <button class="icon" id="hamburger-menu">&#9776;</button>
        </div>
      </div>
    </div>

    <h1>Enter the recipe you wish to add to your collection</h1>
    <div class="page-content">
      <div class="form-1">

        <h2>Recipe Name</h2>
        <form name="recipe-form" id="recipe-form">
          <input type="text" id="recipe-name" name="recipe-name">
        </form>
        <div class="heading-row">
          <h2>Ingredients</h2>
          <button type="button" id="ingredient-add-button">+</button>
          <button type="button" id="ingredient-remove-button">-</button>
        </div>

        <form name="ingredient-form" id="ingredient-form">
          <label for="ingredient1">Ingredient 1:</label>
          <input type="text" id="ingredient1" name="ingredient1">
          <br>
        </form>
        <div class="heading-row"><h2>Instructions</h2> <button type="button"
            id="instruction-add-button">+</button>
          <button type="button" id="instruction-remove-button">-</button></div>

        <form id="instructions-form" name="instructions-form">
          <label for="instructions">Step 1:</label><br>
          <input type="text" id="instructions" name="instructions"><br>
        </form>

        <form name="image-form" id="image-form">
          <h4>Add Image:</h4>
          <input type="text" id="image-url" name="image-url"
            placeholder="Enter image URL">
        </form>
        <br>
        <button class="action-btn" id="submit-button">
          Submit
        </button>
      </div>

      <form class="filter-form">
        <h3 class="sidebar-title">Add Filters:</h3>

        <h4 class="filter-group-title">Dietary Restrictions:</h4>
        <label class="filter-label"><input type="checkbox">
          Gluten-free</label>
        <label class="filter-label"><input type="checkbox"> Vegan</label>
        <label class="filter-label"><input type="checkbox"> Nut-free</label>
        <label class="filter-label"><input type="checkbox"> Soy-free</label>
        <label class="filter-label"><input type="checkbox"> Dairy-free</label>

        <h4 class="filter-group-title">Recipe Type:</h4>
        <label class="filter-label"><input type="checkbox"> Dessert</label>
        <label class="filter-label"><input type="checkbox"> Entree</label>
        <label class="filter-label"><input type="checkbox"> Appetizer</label>
      </form>

    </body>
  </html>
